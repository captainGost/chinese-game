<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chinese Vocab Ultimate Obby</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Kanit', sans-serif;
            touch-action: manipulation;
            user-select: none;
            overflow: hidden;
            margin: 0;
            background-color: #0f172a;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.7);
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: #f472b6;
            border-radius: 4px;
        }
        @keyframes toastSlide {
            0% { transform: translateY(-20px); opacity: 0; }
            20% { transform: translateY(0); opacity: 1; }
            80% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-20px); opacity: 0; }
        }
        .toast-active {
            animation: toastSlide 1.5s ease-in-out forwards;
        }
        .btn-touch-active:active {
            transform: scale(0.88);
            background-color: rgba(236, 72, 153, 0.9) !important;
        }
    </style>
</head>
<body class="w-full h-full text-gray-800">

    <!-- Canvas Container -->
    <div id="game-container" class="relative w-full h-full"></div>

    <!-- UI Overlay / HUD -->
    <div id="hud" class="absolute top-0 left-0 w-full p-4 pointer-events-none flex justify-between items-start z-10 hidden">
        <!-- Progress & Score -->
        <div class="glass-panel p-3 rounded-2xl shadow-lg pointer-events-auto flex items-center space-x-4">
            <div class="flex items-center space-x-2">
                <span id="hud-char-icon" class="text-2xl">🐷</span>
                <div>
                    <div class="text-xs text-gray-500 font-semibold">ด่านที่ (Checkpoint)</div>
                    <div id="checkpoint-text" class="text-lg font-bold text-pink-600">0 / 10</div>
                </div>
            </div>
            <div class="w-px h-8 bg-gray-300"></div>
            <div class="flex items-center space-x-2">
                <span class="text-2xl">⭐</span>
                <div>
                    <div class="text-xs text-gray-500 font-semibold">คะแนน (Score)</div>
                    <div id="score-text" class="text-lg font-bold text-yellow-500">0</div>
                </div>
            </div>
        </div>

        <!-- How to play button -->
        <button id="help-btn" class="glass-panel p-3 rounded-2xl shadow-lg pointer-events-auto hover:bg-white transition active:scale-95 text-xl">
            ❓
        </button>
    </div>

    <!-- Auto-Save Notification Toast -->
    <div id="save-toast" class="absolute top-20 left-1/2 transform -translate-x-1/2 glass-panel px-4 py-2 rounded-full shadow-lg border border-pink-300 pointer-events-none hidden z-20 flex items-center space-x-2">
        <span class="text-sm">📍</span>
        <span class="text-xs font-bold text-pink-600">บันทึกจุดเกิดใหม่บนแท่นแล้ว!</span>
    </div>

    <!-- Mobile Touch Controls -->
    <div id="touch-controls" class="absolute bottom-6 left-4 right-4 pointer-events-none justify-between items-end z-10 hidden flex md:hidden">
        
        <!-- D-Pad Directional Buttons -->
        <div class="pointer-events-auto relative w-40 h-40">
            <!-- Up -->
            <button id="btn-up" class="btn-touch-active absolute top-0 left-12 w-16 h-14 bg-white/80 border-2 border-pink-400 rounded-t-2xl shadow-lg font-bold text-2xl text-pink-600 flex items-center justify-center">▲</button>
            <!-- Down -->
            <button id="btn-down" class="btn-touch-active absolute bottom-0 left-12 w-16 h-14 bg-white/80 border-2 border-pink-400 rounded-b-2xl shadow-lg font-bold text-2xl text-pink-600 flex items-center justify-center">▼</button>
            <!-- Left -->
            <button id="btn-left" class="btn-touch-active absolute top-12 left-0 w-14 h-16 bg-white/80 border-2 border-pink-400 rounded-l-2xl shadow-lg font-bold text-2xl text-pink-600 flex items-center justify-center">◀</button>
            <!-- Right -->
            <button id="btn-right" class="btn-touch-active absolute top-12 right-0 w-14 h-16 bg-white/80 border-2 border-pink-400 rounded-r-2xl shadow-lg font-bold text-2xl text-pink-600 flex items-center justify-center">▶</button>
            <!-- Center Decor -->
            <div class="absolute top-12 left-12 w-16 h-16 bg-pink-100 border border-pink-300 flex items-center justify-center pointer-events-none">
                <span class="text-xs text-pink-400 font-bold">MOVE</span>
            </div>
        </div>

        <!-- Jump Button -->
        <div class="pointer-events-auto flex items-center space-x-3">
            <button id="jump-btn" class="w-24 h-24 bg-pink-500/90 active:bg-pink-600 border-4 border-white text-white rounded-full shadow-2xl font-bold text-xl flex flex-col items-center justify-center active:scale-90 transition">
                <span>🦘</span>
                <span class="text-xs font-black tracking-wider">JUMP</span>
            </button>
        </div>
    </div>

    <!-- Keyboard & Camera Touch Hint -->
    <div id="desktop-hint" class="hidden absolute bottom-4 left-4 glass-panel p-3 rounded-xl text-xs text-gray-600 z-10 pointer-events-none">
        🎮 <b>เดิน:</b> W A S D / ลูกศร | <b>กระโดด:</b> Spacebar | <b>หมุนกล้อง:</b> ลากเมาส์ / สไลด์หน้าจอ 360°
    </div>

    <!-- CHARACTER SELECTION MENU (START MODAL) -->
    <div id="char-select-modal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="glass-panel max-w-xl w-full rounded-3xl p-6 shadow-2xl border-4 border-pink-300 text-center">
            <h1 class="text-3xl font-extrabold text-pink-600 mb-1">🎮 Chinese Vocab Obby</h1>
            <p class="text-sm text-gray-600 mb-6">เลือกตัวละครที่คุณชื่นชอบเพื่อเริ่มการผจญภัย 10 ด่าน!</p>

            <!-- 6 Characters Grid -->
            <div class="grid grid-cols-3 gap-3 mb-6">
                <!-- Pig -->
                <button onclick="selectCharacter('pig')" class="char-card border-2 border-pink-400 bg-pink-50 p-3 rounded-2xl flex flex-col items-center hover:scale-105 active:scale-95 transition shadow-sm hover:shadow-md">
                    <span class="text-4xl mb-1">🐷</span>
                    <span class="font-bold text-gray-700 text-sm">น้องหมู</span>
                </button>
                <!-- Sun -->
                <button onclick="selectCharacter('sun')" class="char-card border-2 border-yellow-300 bg-yellow-50 p-3 rounded-2xl flex flex-col items-center hover:scale-105 active:scale-95 transition shadow-sm hover:shadow-md">
                    <span class="text-4xl mb-1">☀️</span>
                    <span class="font-bold text-gray-700 text-sm">พระอาทิตย์</span>
                </button>
                <!-- Sunflower -->
                <button onclick="selectCharacter('flower')" class="char-card border-2 border-amber-300 bg-amber-50 p-3 rounded-2xl flex flex-col items-center hover:scale-105 active:scale-95 transition shadow-sm hover:shadow-md">
                    <span class="text-4xl mb-1">🌻</span>
                    <span class="font-bold text-gray-700 text-sm">ดอกทานตะวัน</span>
                </button>
                <!-- Chicken -->
                <button onclick="selectCharacter('chicken')" class="char-card border-2 border-red-300 bg-red-50 p-3 rounded-2xl flex flex-col items-center hover:scale-105 active:scale-95 transition shadow-sm hover:shadow-md">
                    <span class="text-4xl mb-1">🐔</span>
                    <span class="font-bold text-gray-700 text-sm">กุ๊กไก่</span>
                </button>
                <!-- Duck -->
                <button onclick="selectCharacter('duck')" class="char-card border-2 border-emerald-300 bg-emerald-50 p-3 rounded-2xl flex flex-col items-center hover:scale-105 active:scale-95 transition shadow-sm hover:shadow-m
