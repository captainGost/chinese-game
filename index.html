0">คำศัพท์</h2>
                <p class="text-sm text-gray-500 mb-6">ความหมายของคำนี้คืออะไร?</p>
            </div>
            <div id="quiz-options" class="grid grid-cols-1 gap-3">
                <!-- ตัวเลือกจะถูกสร้างด้วย JavaScript -->
            </div>
        </div>
    </div>

    <!-- Game Over / Victory Modal -->
    <div id="victory-modal" class="fixed inset-0 bg-green-900/90 backdrop-blur-md z-50 hidden flex flex-col items-center justify-center p-4">
        <div class="text-6xl mb-4 animate-bounce">🏆</div>
        <h1 class="text-5xl font-extrabold text-white mb-2 text-center shadow-black drop-shadow-lg">ยินดีด้วย!</h1>
        <p class="text-xl text-green-200 mb-8 text-center max-w-md">คุณผ่านด่านและเรียนรู้คำศัพท์ภาษาจีนครบ 10 ด่านแล้ว สุดยอดมาก!</p>
        <div class="glass-panel p-6 rounded-3xl text-center mb-8 w-full max-w-sm">
            <div class="text-sm text-gray-600 font-bold mb-1">คะแนนรวมของคุณ</div>
            <div id="final-score" class="text-5xl font-black text-yellow-500">0</div>
        </div>
        <button onclick="location.reload()" class="bg-white text-green-700 font-bold text-xl px-8 py-4 rounded-full shadow-2xl hover:scale-105 active:scale-95 transition">
            เล่นอีกครั้ง 🔄
        </button>
    </div>

    <!-- Game Script -->
    <script>
        // --- 1. VOCABULARY DATABASE ---
        const vocabData = [
            { word: "你好", pinyin: "nǐ hǎo", meaning: "สวัสดี", false1: "ขอบคุณ", false2: "ลาก่อน", false3: "ขอโทษ" },
            { word: "谢谢", pinyin: "xiè xiè", meaning: "ขอบคุณ", false1: "ใช่", false2: "ไม่ใช่", false3: "สวัสดี" },
            { word: "再见", pinyin: "zài jiàn", meaning: "ลาก่อน", false1: "พรุ่งนี้", false2: "เมื่อวาน", false3: "ขอบคุณ" },
            { word: "狗", pinyin: "gǒu", meaning: "หมา", false1: "แมว", false2: "นก", false3: "หมู" },
            { word: "猫", pinyin: "māo", meaning: "แมว", false1: "หมา", false2: "ปลา", false3: "ม้า" },
            { word: "水", pinyin: "shuǐ", meaning: "น้ำ", false1: "ไฟ", false2: "ดิน", false3: "ลม" },
            { word: "火", pinyin: "huǒ", meaning: "ไฟ", false1: "น้ำ", false2: "ไม้", false3: "ทอง" },
            { word: "太阳", pinyin: "tài yáng", meaning: "พระอาทิตย์", false1: "พระจันทร์", false2: "ดวงดาว", false3: "เมฆ" },
            { word: "月亮", pinyin: "yuè liang", meaning: "พระจันทร์", false1: "พระอาทิตย์", false2: "ท้องฟ้า", false3: "ฝน" },
            { word: "猪", pinyin: "zhū", meaning: "หมู", false1: "ไก่", false2: "เป็ด", false3: "วัว" }
        ];

        // --- 2. GLOBAL VARIABLES ---
        let scene, camera, renderer;
        let player;
        let playerSpeed = 0.15;
        let playerVelocityY = 0;
        let gravity = -0.015;
        let jumpForce = 0.35;
        let isGrounded = false;
        
        // Input tracking
        const keys = { w: false, a: false, s: false, d: false, space: false };
        
        // Camera rotation variables
        let camAngle = 0; 
        let camPitch = 0.3;
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };

        // Game state
        let gameStarted = false;
        let score = 0;
        let currentCheckpointIndex = 0;
        let spawnPoint = { x: 0, y: 5, z: 0 };
        
        // Arrays for collision detection
        const platforms = [];
        const killZones = []; // Red blocks
        const checkpoints = [];
        const gates = [];
        const triggers = [];

        // Active Quiz state
        let isQuizActive = false;
        let currentGateTrigger = null;

        // Emojis mapping
        const chars = {
            'pig': '🐷', 'sun': '☀️', 'flower': '🌻',
            'chicken': '🐔', 'duck': '🦆', 'frog': '🐸'
        };

        // --- 3. INITIALIZATION ---
        function init() {
            // Scene Setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB); // Sky blue
            scene.fog = new THREE.Fog(0x87CEEB, 10, 100);

            // Camera Setup
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            // Renderer Setup
            const container = document.getElementById('game-container');
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
            dirLight.position.set(10, 20, 10);
            dirLight.castShadow = true;
            dirLight.shadow.camera.left = -50;
            dirLight.shadow.camera.right = 50;
            dirLight.shadow.camera.top = 50;
            dirLight.shadow.camera.bottom = -50;
            scene.add(dirLight);

            // Event Listeners
            setupInputs();
            
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            // Start game loop (paused until character selected)
            requestAnimationFrame(animate);
        }

        // --- 4. ASSET CREATION ---
        function createEmojiTexture(emoji) {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            
            // Background
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, 256, 256);
            ctx.lineWidth = 10;
            ctx.strokeStyle = '#f472b6';
            ctx.strokeRect(0,0,256,256);
            
            // Emoji
            ctx.font = '160px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(emoji, 128, 140);
            
            return new THREE.CanvasTexture(canvas);
        }

        function createLevel() {
            // Level generation settings
            const gap = 12;
            let currentZ = 0;

            for (let i = 0; i < 10; i++) {
                const isLast = (i === 9);

                // 1. Checkpoint Platform
                createPlatform(0, 0, currentZ, 10, 1, 10, 0x4ade80, 'checkpoint', i);
                if (i === 0) spawnPoint = { x: 0, y: 5, z: currentZ };

                // 2. Obstacles (Obby style jumping)
                currentZ -= gap;
                createPlatform(0, 0, currentZ, 4, 1, 4, 0xffffff, 'normal');
                
                currentZ -= gap;
                // Trap zone in later levels
                if (i > 2) {
                    createPlatform(-3, 0, currentZ, 3, 1, 3, 0xffffff, 'normal');
                    createPlatform(3, 0, currentZ, 3, 1, 3, 0xffffff, 'normal');
                    createPlatform(0, 0, currentZ, 4, 0.5, 4, 0xef4444, 'kill'); // Lava
                } else {
                    createPlatform(0, 0, currentZ, 4, 1, 4, 0xffffff, 'normal');
                }

                currentZ -= gap;
                createPlatform(0, 0, currentZ, 10, 1, 10, 0xfbcfe8, 'normal'); // Pre-gate platform

                // 3. Vocab Gate
                if (!isLast) {
                    createGate(0, 1.5, currentZ - 4.5, i);
                    createTrigger(0, 1, currentZ - 2, i);
                } else {
                    // Final Victory Trigger
                    createPlatform(0, 1, currentZ - 2, 4, 0.5, 4, 0xfacc15, 'victory');
                }

                currentZ -= gap;
            }
        }

        function createPlatform(x, y, z, w, h, d, color, type, index = -1) {
            const geo = new THREE.BoxGeometry(w, h, d);
            const mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.8 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, y, z);
            mesh.receiveShadow = true;
            mesh.castShadow = true;
            scene.add(mesh);
            
            const box = new THREE.Box3().setFromObject(mesh);
            
            if (type === 'normal') platforms.push({ mesh, box });
            else if (type === 'kill') killZones.push({ mesh, box });
            else if (type === 'checkpoint') checkpoints.push({ mesh, box, index, active: false });
            else if (type === 'victory') triggers.push({ box, type: 'victory' });
        }

        function createGate(x, y, z, vocabIndex) {
            const geo = new THREE.BoxGeometry(10, 5, 1);
            const mat = new THREE.MeshStandardMaterial({ color: 0x334155, transparent: true, opacity: 0.9 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, y, z);
            scene.add(mesh);
            
            // Add Text to Gate (Simulated with distinct color for now, since TextGeometry needs external font)
            const decoGeo = new THREE.BoxGeometry(4, 2, 1.2);
            const decoMat = new THREE.MeshStandardMaterial({ color: 0xec4899 });
            const deco = new THREE.Mesh(decoGeo, decoMat);
            deco.position.set(x, y+0.5, z);
            scene.add(deco);

            const box = new THREE.Box3().setFromObject(mesh);
            gates.push({ mesh, deco, box, vocabIndex, isSolved: false });
            platforms.push({ mesh, box }); // Act as wall
        }

        function createTrigger(x, y, z, vocabIndex) {
            const box = new THREE.Box3();
            box.min.set(x - 3, y - 1, z - 2);
            box.max.set(x + 3, y + 2, z + 2);
            triggers.push({ box, type: 'quiz', vocabIndex });
        }

        // --- 5. CHARACTER SELECTION ---
        window.selectCharacter = function(charKey) {
            const emoji = chars[charKey];
            document.getElementById('hud-char-icon').innerText = emoji;
            
            // Create Player Mesh
            const texture = createEmojiTexture(emoji);
            const geo = new THREE.BoxGeometry(1.2, 1.2, 1.2);
            const mat = new THREE.MeshStandardMaterial({ map: texture });
            player = new THREE.Mesh(geo, mat);
            player.position.copy(spawnPoint);
            player.castShadow = true;
            scene.add(player);

            createLevel();

            document.getElementById('char-select-modal').style.display = 'none';
            document.getElementById('hud').classList.remove('hidden');
            
            // Show mobile controls if touch device
            if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
                document.getElementById('touch-controls').classList.remove('hidden');
                document.getElementById('touch-controls').classList.add('flex');
            } else {
                document.getElementById('desktop-hint').classList.remove('hidden');
            }

            gameStarted = true;
        }

        // --- 6. INPUT HANDLING ---
        function setupInputs() {
            // Keyboard
            window.addEventListener('keydown', (e) => {
                if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') keys.w = true;
                if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') keys.a = true;
                if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') keys.s = true;
                if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') keys.d = true;
                if (e.key === ' ') keys.space = true;
            });

            window.addEventListener('keyup', (e) => {
                if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') keys.w = false;
                if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') keys.a = false;
                if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') keys.s = false;
                if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') keys.d = false;
                if (e.key === ' ') keys.space = false;
            });

            // Camera Drag (Mouse)
            const container = document.getElementById('game-container');
            container.addEventListener('mousedown', (e) => {
                isDragging = true;
                previousMousePosition = { x: e.clientX, y: e.clientY };
            });
            window.addEventListener('mouseup', () => isDragging = false);
            window.addEventListener('mousemove', (e) => {
                if (isDragging) {
                    const deltaX = e.clientX - previousMousePosition.x;
                    const deltaY = e.clientY - previousMousePosition.y;
                    camAngle -= deltaX * 0.01;
                    camPitch += deltaY * 0.01;
                    camPitch = Math.max(0.1, Math.min(1.5, camPitch)); // Clamp pitch
                    previousMousePosition = { x: e.clientX, y: e.clientY };
                }
            });

            // Camera Drag (Touch) - on main canvas only
            container.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    isDragging = true;
                    previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                }
            });
            window.addEventListener('touchend', () => isDragging = false);
            window.addEventListener('touchmove', (e) => {
                if (isDragging && e.touches.length === 1) {
                    const deltaX = e.touches[0].clientX - previousMousePosition.x;
                    const deltaY = e.touches[0].clientY - previousMousePosition.y;
                    camAngle -= deltaX * 0.01;
                    camPitch += deltaY * 0.01;
                    camPitch = Math.max(0.1, Math.min(1.5, camPitch));
                    previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                }
            }, { passive: true });

            // On-screen Buttons (Touch)
            const bindBtn = (id, key) => {
                const btn = document.getElementById(id);
                if (!btn) return;
                btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; });
                btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; });
                // Fallback for mouse click on mobile UI
                btn.addEventListener('mousedown', (e) => { e.preventDefault(); keys[key] = true; });
                btn.addEventListener('mouseup', (e) => { e.preventDefault(); keys[key] = false; });
                btn.addEventListener('mouseleave', (e) => { e.preventDefault(); keys[key] = false; });
            };
            bindBtn('btn-up', 'w');
            bindBtn('btn-down', 's');
            bindBtn('btn-left', 'a');
            bindBtn('btn-right', 'd');
            bindBtn('jump-btn', 'space');

            // Help Button
            document.getElementById('help-btn').addEventListener('click', () => {
                alert('เป้าหมาย: กระโดดผ่านอุปสรรคและตอบคำถามคำศัพท์ภาษาจีนเพื่อปลดล็อกประตู!\n\nควบคุม:\n- ขยับ: W A S D / ลูกศร / D-Pad\n- กระโดด: Spacebar / ปุ่ม Jump\n- หมุนมุมกล้อง: ลากเมาส์ / เลื่อนจอ');
            });
        }

        // --- 7. QUIZ LOGIC ---
        function triggerQuiz(vocabIndex) {
            isQuizActive = true;
            // Stop player
            keys.w = false; keys.a = false; keys.s = false; keys.d = false; keys.space = false;
            
            const data = vocabData[vocabIndex];
            currentGateTrigger = vocabIndex;

            document.getElementById('quiz-word').innerHTML = `${data.word} <span class="text-xl text-gray-500">(${data.pinyin})</span>`;
            
            const options = [data.meaning, data.false1, data.false2, data.false3];
            // Shuffle options
            options.sort(() => Math.random() - 0.5);

            const optionsContainer = document.getElementById('quiz-options');
            optionsContainer.innerHTML = '';
            
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'w-full py-4 px-6 bg-white border-2 border-pink-200 hover:border-pink-500 hover:bg-pink-50 text-gray-800 rounded-2xl font-bold text-lg shadow-sm transition active:scale-95 text-left flex justify-between items-center';
                btn.innerHTML = `<span>${opt}</span><span class="text-pink-300 opacity-0 btn-arrow">▶</span>`;
                
                // Add hover effect for arrow via inline JS
                btn.onmouseenter = () => btn.querySelector('.btn-arrow').classList.replace('opacity-0', 'opacity-100');
                btn.onmouseleave = () => btn.querySelector('.btn-arrow').classList.replace('opacity-100', 'opacity-0');

                btn.onclick = () => checkAnswer(opt === data.meaning);
                optionsContainer.appendChild(btn);
            });

            document.getElementById('quiz-modal').classList.remove('hidden');
        }

        function checkAnswer(isCorrect) {
            document.getElementById('quiz-modal').classList.add('hidden');
            isQuizActive = false;

            if (isCorrect) {
                // Correct - Open gate
                const gate = gates.find(g => g.vocabIndex === currentGateTrigger);
                if (gate) {
                    gate.isSolved = true;
                    // Animate gate disappearing (simple approach: move it down)
                    gate.mesh.position.y -= 10;
                    gate.deco.position.y -= 10;
                    gate.box.translate(new THREE.Vector3(0, -10, 0)); // Move bounding box away
                    
                    score += 100;
                    updateHUD();
                }
            } else {
                // Wrong - Respawn
                die();
            }
        }

        function triggerVictory() {
            isQuizActive = true; // Pause game
            document.getElementById('final-score').innerText = score;
            document.getElementById('victory-modal').classList.remove('hidden');
        }

        function showSaveToast() {
            const toast = document.getElementById('save-toast');
            toast.classList.remove('hidden');
            toast.classList.remove('toast-active');
            void toast.offsetWidth; // trigger reflow
            toast.classList.add('toast-active');
        }

        function updateHUD() {
            document.getElementById('checkpoint-text').innerText = `${currentCheckpointIndex} / 10`;
            document.getElementById('score-text').innerText = score;
        }

        function die() {
            player.position.copy(spawnPoint);
            playerVelocityY = 0;
            // flash red effect could be added here
        }

        // --- 8. GAME LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            if (!gameStarted || isQuizActive) {
                renderer.render(scene, camera);
                return;
            }

            // Calculate movement vectors based on camera angle
            const forward = new THREE.Vector3(Math.sin(camAngle), 0, Math.cos(camAngle)).normalize();
            const right = new THREE.Vector3(forward.z, 0, -forward.x).normalize();

            let moveX = 0;
            let moveZ = 0;

            if (keys.w) { moveX -= forward.x; moveZ -= forward.z; }
            if (keys.s) { moveX += forward.x; moveZ += forward.z; }
            if (keys.a) { moveX -= right.x; moveZ -= right.z; }
            if (keys.d) { moveX += right.x; moveZ += right.z; }

            // Normalize diagonal movement
            if (moveX !== 0 || moveZ !== 0) {
                const length = Math.sqrt(moveX * moveX + moveZ * moveZ);
                moveX = (moveX / length) * playerSpeed;
                moveZ = (moveZ / length) * playerSpeed;
            }

            // Jump & Gravity
            if (keys.space && isGrounded) {
                playerVelocityY = jumpForce;
                isGrounded = false;
            }
            playerVelocityY += gravity;

            // Apply intended movement
            const nextPos = player.position.clone();
            nextPos.x += moveX;
            nextPos.z += moveZ;
            nextPos.y += playerVelocityY;

            // Player Bounding Box (Slightly smaller for smoother wall sliding)
            const playerBox = new THREE.Box3();
            const hs = 0.5; // half size
            
            // --- COLLISION DETECTION ---
            isGrounded = false;
            let hitWall = false;

            for (const p of platforms) {
                // Update player box to next position
                playerBox.min.set(nextPos.x - hs, nextPos.y - hs, nextPos.z - hs);
                playerBox.max.set(nextPos.x + hs, nextPos.y + hs, nextPos.z + hs);

                if (playerBox.intersectsBox(p.box)) {
                    // Determine collision direction
                    const overlapY = Math.min(playerBox.max.y - p.box.min.y, p.box.max.y - playerBox.min.y);
                    const overlapX = Math.min(playerBox.max.x - p.box.min.x, p.box.max.x - playerBox.min.x);
                    const overlapZ = Math.min(playerBox.max.z - p.box.min.z, p.box.max.z - playerBox.min.z);

                    if (overlapY < overlapX && overlapY < overlapZ) {
                        // Vertical collision
                        if (playerVelocityY < 0 && player.position.y >= p.box.max.y - 0.1) {
                            // Landed on top
                            nextPos.y = p.box.max.y + hs;
                            playerVelocityY = 0;
                            isGrounded = true;
                        } else if (playerVelocityY > 0 && player.position.y <= p.box.min.y) {
                            // Hit head
                            nextPos.y = p.box.min.y - hs;
                            playerVelocityY = 0;
                        }
                    } else {
                        // Horizontal collision (Wall)
                        hitWall = true;
                        if (overlapX < overlapZ) {
                            nextPos.x = player.position.x; // Block X
                        } else {
                            nextPos.z = player.position.z; // Block Z
                        }
                    }
                }
            }

            // Update player pos
            player.position.copy(nextPos);

            // Spin player mesh slightly based on movement for juice
            if (moveX !== 0 || moveZ !== 0) {
                // Determine rotation target based on movement direction
                const targetAngle = Math.atan2(moveX, moveZ);
                // Simple snap to rotation
                player.rotation.y = targetAngle;
                // Add rolling effect
                player.rotation.z = Math.sin(Date.now() * 0.01) * 0.1;
            } else {
                player.rotation.z = 0;
            }

            // Check Checkpoints
            playerBox.setFromObject(player);
            for (const cp of checkpoints) {
                if (!cp.active && playerBox.intersectsBox(cp.box)) {
                    cp.active = true;
                    if (cp.index > currentCheckpointIndex) {
                        currentCheckpointIndex = cp.index;
                        spawnPoint.x = cp.mesh.position.x;
                        spawnPoint.y = cp.mesh.position.y + 1;
                        spawnPoint.z = cp.mesh.position.z;
                        score += 50;
                        updateHUD();
                        showSaveToast();
                    }
                }
            }

            // Check KillZones
            for (const kz of killZones) {
                if (playerBox.intersectsBox(kz.box)) {
                    die();
                }
            }

            // Check Triggers (Quiz & Victory)
            for (const t of triggers) {
                if (playerBox.intersectsBox(t.box)) {
                    if (t.type === 'quiz') {
                        const gate = gates.find(g => g.vocabIndex === t.vocabIndex);
                        if (gate && !gate.isSolved) {
                            triggerQuiz(t.vocabIndex);
                        }
                    } else if (t.type === 'victory') {
                        triggerVictory();
                    }
                }
            }

            // Fall off edge death
            if (player.position.y < -15) {
                die();
            }

            // Update Camera Position
            const camDistance = 8;
            camera.position.x = player.position.x + Math.sin(camAngle) * camDistance;
            camera.position.z = player.position.z + Math.cos(camAngle) * camDistance;
            camera.position.y = player.position.y + (camPitch * 10);
            
            camera.lookAt(player.position.x, player.position.y + 1, player.position.z);

            renderer.render(scene, camera);
        }

        // Initialize game on load
        window.onload = init;

    </script>
</body>
